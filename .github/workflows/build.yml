name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Regenerates src-gen and model/generated from the grammars, then
      # compiles and runs the tests.
      - name: Build and test
        run: mvn -B clean install

      # Regenerates the committed example output with the freshly built CLI.
      - name: Generate examples
        run: |
          for model in examples/*.shardml; do
            java -jar shardml.cli/target/*-cli.jar generate "$model"
          done

      # Everything generated is committed, so a clean build must not change
      # it. --porcelain also lists untracked files, so new outputs count too.
      - name: Check for generation drift
        run: |
          paths=(':(glob)**/src-gen/**' 'shardml/model/generated')
          drift=$(git status --porcelain -- "${paths[@]}")
          if [[ -n "$drift" ]]; then
            echo "::error::Generated files differ from the committed ones. Rebuild locally and commit the result."
            echo "$drift"
            git diff --stat -- "${paths[@]}"
            exit 1
          fi

  # Deploys the generated SQL of every example to a real Citus cluster
  # (bench/docker-compose.yml) and runs the examples' probe joins.
  integration:
    runs-on: ubuntu-latest
    # Known to fail until the Phase 1 fixes land (PK/UNIQUE constraints that
    # miss the distribution column, colocation on mismatched keys); enforce
    # it once it passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the CLI
        run: mvn -B -q install -DskipTests

      - name: Deploy examples to Citus
        run: bench/integration/test-examples.sh
