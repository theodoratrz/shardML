name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Regenerates src-gen and model/generated from the grammars, then
      # compiles and runs the tests.
      - name: Build and test
        run: mvn -B clean install

      # Regenerates the committed example output with the freshly built CLI.
      - name: Generate examples
        run: |
          for model in examples/*.shardml; do
            java -jar shardml.cli/target/*-cli.jar generate "$model"
          done

      # Regenerates the cost examples' expected outputs (tables, JSON, CSV, sweeps)
      # with the freshly built CLI.
      - name: Regenerate cost examples
        run: examples/cost/regenerate.sh

      # Everything generated is committed, so a clean build must not change
      # it. --porcelain also lists untracked files, so new outputs count too.
      - name: Check for generation drift
        run: |
          paths=(':(glob)**/src-gen/**' 'shardml/model/generated' 'examples/cost/expected')
          drift=$(git status --porcelain -- "${paths[@]}")
          if [[ -n "$drift" ]]; then
            echo "::error::Generated files differ from the committed ones. Rebuild locally and commit the result."
            echo "$drift"
            git diff --stat -- "${paths[@]}"
            exit 1
          fi

  # Deploys the generated SQL of every example to a real Citus cluster
  # (bench/docker-compose.yml) and runs the examples' probe joins.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the CLI
        run: mvn -B -q install -DskipTests

      # The pg_dump fixtures import corpus files through symlinks; fail here, by name, if the
      # checkout did not keep them as links to non-empty files.
      - name: Corpus links resolve
        run: |
          for f in bench/integration/pgdump/*.msql; do
            [[ -L "$f" && -s "$f" ]] || { echo "$f is not a symlink to a non-empty file"; exit 1; }
          done

      # examples, types, fk and the pg_dump fixtures; fails if a required model is missing or skipped
      - name: Deploy examples and fixtures to Citus
        run: bench/integration/test-examples.sh

      # Each clean corpus file and the schema generated from it, in two plain databases: the
      # catalogs must be equal but for bench/integration/sql-corpus/allowlist.tsv
      - name: Corpus catalogs, original vs generated
        run: bench/integration/test-sql-corpus.sh

      # The cost model's routing against Citus EXPLAIN: keys, task counts, task nodes and
      # repartition joins for every example layout, but for the allowlist
      - name: Cost model routing on Citus
        run: bench/integration/test-cost-routing.sh

      # Applies generated placement scripts and compares the live shard map with
      # `shardml placement`; every psql run is bounded by timeout(1).
      - name: Shard placement on Citus
        run: bench/integration/test-placement.sh
